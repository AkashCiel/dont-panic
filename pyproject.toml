[project]
name = "dont-panic"
version = "0.1.0"
description = "AGI Capability Tracker — fetch, analyse, and report on AI research against a five-criterion AGI framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "openai>=1.30.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "responses>=0.25.0",
]
openreview = [
    "openreview-py>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
